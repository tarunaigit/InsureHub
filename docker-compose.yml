services:
  postgres:
    image: postgres:16-alpine
    container_name: insurehub-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: insurehub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - insurehub_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d insurehub"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: insurehub-backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      SERVER_PORT: 8080

      DB_URL: jdbc:postgresql://postgres:5432/insurehub
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: 86400000

      # IMPORTANT: Razorpay, not mock
      PAYMENT_MODE: razorpay

      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}

      PAYMENT_CURRENCY: INR

    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080/api

    container_name: insurehub-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "5173:80"

volumes:
  insurehub_pgdata: